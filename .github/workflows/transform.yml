name: Transform Fixtures CSV

on:
  # Triggered by FA-Fixtures-Pull repo via repository_dispatch after a scrape
  repository_dispatch:
    types: [fixtures-updated]
  # Daily safety net in case the dispatch event is missed
  schedule:
    - cron: "30 6 * * *"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  transform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.FIXTURE_MERGING_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download source CSV
        run: |
          curl -fsSL \
            -H "Authorization: token ${{ secrets.FIXTURE_MERGING_PAT }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/repos/iaing80/FA-Fixtures-Pull/contents/fixtures/latest.csv" \
            -o source_fixtures.csv

      - name: Run transform
        run: python transform.py --input source_fixtures.csv --output fixtures_import.csv

      - name: Upload to Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python sheets_upload.py --input fixtures_import.csv --notify-summary notify_summary.json

      - name: Stamp notify summary with run details
        # The PNFC app polls notify_summary.json from this repo (and the
        # commit history of it) and turns each new run_id with any content
        # into an in-app notification. An empty summary creates nothing, so
        # the safety-net run never repeats the dispatch run's changes.
        env:
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          with open("notify_summary.json", encoding="utf-8") as f:
              summary = json.load(f)
          summary["run_id"] = os.environ["RUN_ID"]
          summary["run_at"] = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          summary["event"] = os.environ["EVENT"]
          with open("notify_summary.json", "w", encoding="utf-8") as f:
              json.dump(summary, f, indent=2)
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fixtures_import.csv notify_summary.json
          if git diff --cached --quiet; then
            echo "No changes to fixtures_import.csv or notify_summary.json"
          else
            git commit -m "chore: update fixtures_import.csv and notify_summary.json [skip ci]"
            git push
          fi
