name: Transform Fixtures CSV

on:
  # Triggered by FA-Fixtures-Pull repo via repository_dispatch after a scrape
  repository_dispatch:
    types: [fixtures-updated]
  # Daily safety net in case the dispatch event is missed
  schedule:
    - cron: "30 6 * * *"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  transform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.FIXTURE_MERGING_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download source CSV
        run: |
          curl -fsSL \
            -H "Authorization: token ${{ secrets.FIXTURE_MERGING_PAT }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/repos/iaing80/FA-Fixtures-Pull/contents/fixtures/latest.csv" \
            -o source_fixtures.csv

      - name: Run transform
        run: python transform.py --input source_fixtures.csv --output fixtures_import.csv

      - name: Upload to Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python sheets_upload.py --input fixtures_import.csv --notify-summary notify_summary.json

      - name: Notify Discord of new/changed/cancelled fixtures
        # No if-gate needed: notify_discord.py already no-ops (exit 0) when
        # DISCORD_WEBHOOK_URL is unset, and the `secrets` context can't be
        # referenced directly in a step's `if:` condition anyway.
        #
        # --quiet-if-empty on the schedule-triggered (safety-net) run only:
        # the repository_dispatch-triggered run already posts its own
        # heartbeat/summary for the day, so the safety net shouldn't repeat
        # "nothing changed" ~30-45 min later — it should only speak up if it
        # finds something the dispatch run didn't already report (i.e. the
        # dispatch silently failed to fire that day).
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          ARGS="--summary notify_summary.json"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --quiet-if-empty"
          fi
          python notify_discord.py $ARGS

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fixtures_import.csv
          if git diff --cached --quiet; then
            echo "No changes to fixtures_import.csv"
          else
            git commit -m "chore: update fixtures_import.csv [skip ci]"
            git push
          fi

      - name: Notify Discord on failure
        # Runs even if an earlier step failed, so a broken run is never
        # silent — same DISCORD_WEBHOOK_URL secret as the success-path
        # notify step above. Plain curl rather than notify_discord.py so it
        # doesn't depend on any earlier step (Python setup, deps, etc.)
        # having succeeded.
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -sS -X POST -A "DiscordBot (https://github.com/iaing80/Fixture_Merging, 1.0)" -H "Content-Type: application/json" \
              -d "{\"content\": \"❌ **Fixture sync run failed** — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>\"}" \
              "$DISCORD_WEBHOOK_URL"
          fi
